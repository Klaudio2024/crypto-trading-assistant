<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Trading Assistant</title><style>body{font-family:system-ui;background:#0b1220;color:#e5e7eb;max-width:950px;margin:auto;padding:18px}.card{background:#172033;border:1px solid #293651;border-radius:12px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}button{border:0;border-radius:8px;padding:12px;margin:3px;color:#fff;font-weight:700;cursor:pointer}.green{background:#15803d}.red{background:#b91c1c}.gray{background:#475569}.value{font-size:22px;font-weight:700}.muted{color:#94a3b8}.event{border-top:1px solid #334155;padding:9px 0}input{padding:9px;border-radius:6px;border:1px solid #64748b;background:#0f172a;color:#fff;width:100%;margin:3px}</style></head><body><h1>Crypto Trading Assistant</h1><p class="muted">PAPER TRADING ONLY · Shqip / English · No real orders</p><div class="card"><b id="status">Loading…</b><p id="msg"></p><button class="green" onclick="openPaper()">START PAPER BOT</button><button class="red" onclick="stopBot()">EMERGENCY STOP</button><button class="gray" onclick="restartBot()">RESTART PAPER</button></div><div class="grid" id="metrics"></div><div class="card"><h2>Open Positions / Pozicionet e hapura</h2><div id="positions" class="muted">Loading…</div></div><div class="card"><h2>Audit Journal / Regjistri</h2><div id="journal" class="muted">Loading…</div></div><script>const $=id=>document.getElementById(id);let data;function money(n){return Number(n||0).toFixed(2)+' USDT'}function message(t){$('msg').textContent=t}async function load(){data=await (await fetch('/api/status')).json();$('status').textContent=data.locked?'LOCKED / I KYÇUR':'PAPER TRADING';$('metrics').innerHTML=[['Virtual Balance',money(data.cash)],['Total Equity',money(data.total_equity)],['Invested',money(data.invested)],['Open Exposure',(data.exposure*100).toFixed(2)+'%'],['Drawdown',(data.drawdown*100).toFixed(2)+'%'],['Open Positions',data.open_positions]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><div class="value">${x[1]}</div></div>`).join('');$('positions').innerHTML=data.positions.length?data.positions.map(p=>`<div class="event"><b>${p.symbol}</b> · Qty ${Number(p.qty).toFixed(6)}<br>Entry ${p.entry} · SL ${p.stop} · TP ${p.target}<br><button class="gray" onclick="closeP('${p.id}',${p.entry})">CLOSE VIRTUAL POSITION</button></div>`).join(''):'No open paper positions.';let j=await (await fetch('/api/journal')).json();$('journal').innerHTML=j.length?j.map(e=>`<div class="event"><b>${e.event}</b> ${e.symbol||''}<br><span class="muted">${e.ts}</span><br>${e.details.reason||JSON.stringify(e.details)}</div>`).join(''):'No events yet.'}async function openPaper(){let r=await (await fetch('/api/paper-signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})})).json();message(r.reason);load()}async function stopBot(){let r=await (await fetch('/api/emergency-stop',{method:'POST'})).json();message(r.message);load()}async function restartBot(){let r=await (await fetch('/api/restart-paper',{method:'POST'})).json();message(r.message);load()}async function closeP(id,price){let r=await (await fetch('/api/positions/'+id+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price})})).json();message(r.closed?'Position closed. Net P&L: '+r.net_pnl:r.detail);load()}load()</script></body></html>
